<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Reliquary</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#070605"/><path d="M40 40H1160M40 347H1160" stroke="#8f8577" stroke-opacity=".8"/><path d="M320 40V347" stroke="#8f8577" stroke-opacity=".55"/><text x="55" y="67" fill="#8f8577" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#d6ad6e" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#8f8577" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#d6ad6e" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#d6ad6e"/> --><text x="180" y="191" text-anchor="middle" fill="#d6ad6e" font-family="Georgia,serif" font-size="54" font-style="italic">L</text><text x="55" y="281" fill="#ece4d6" font-family="Georgia,serif" font-style="italic" font-size="22">The lantern</text><text x="55" y="307" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">A single pool of light begins</text><text x="55" y="325" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">the visit.</text><path d="M600 40V347" stroke="#8f8577" stroke-opacity=".55"/><text x="335" y="67" fill="#8f8577" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#d6ad6e" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#8f8577" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#d6ad6e" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#d6ad6e"/> --><text x="460" y="191" text-anchor="middle" fill="#d6ad6e" font-family="Georgia,serif" font-size="54" font-style="italic">C</text><text x="335" y="281" fill="#ece4d6" font-family="Georgia,serif" font-style="italic" font-size="22">The collection</text><text x="335" y="307" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">Objects carry their own</text><text x="335" y="325" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">centuries of detail.</text><path d="M880 40V347" stroke="#8f8577" stroke-opacity=".55"/><text x="615" y="67" fill="#8f8577" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#d6ad6e" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#8f8577" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#d6ad6e" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#d6ad6e"/> --><text x="740" y="191" text-anchor="middle" fill="#d6ad6e" font-family="Georgia,serif" font-size="54" font-style="italic">N</text><text x="615" y="281" fill="#ece4d6" font-family="Georgia,serif" font-style="italic" font-size="22">Night hours</text><text x="615" y="307" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">The museum belongs to the</text><text x="615" y="325" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">quiet after closing.</text><path d="M1160 40V347" stroke="#8f8577" stroke-opacity=".55"/><text x="895" y="67" fill="#8f8577" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#d6ad6e" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#8f8577" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#d6ad6e" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#d6ad6e"/> --><text x="1020" y="191" text-anchor="middle" fill="#d6ad6e" font-family="Georgia,serif" font-size="54" font-style="italic">K</text><text x="895" y="281" fill="#ece4d6" font-family="Georgia,serif" font-style="italic" font-size="22">A key to the dark</text><text x="895" y="307" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">Membership extends the</text><text x="895" y="325" fill="#8f8577" font-family="Arial,sans-serif" font-size="11">imagined visit.</text></svg>